name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autograph_test
          POSTGRES_USER: autograph_test
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U autograph_test -d autograph_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://autograph_test:local_test_only@localhost:5433/autograph_test
      TEST_DATABASE_URL: postgresql://autograph_test:local_test_only@localhost:5433/autograph_test
      API_HOST: 127.0.0.1
      API_PORT: 4000
      SESSION_TTL_SECONDS: 1209600
      TRUSTED_WEB_ORIGINS: http://127.0.0.1:3000,http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:3000
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_REDIRECT_URI: http://127.0.0.1:4000/auth/google/callback
      TELEGRAM_CLIENT_ID: test-telegram-client-id
      TELEGRAM_CLIENT_SECRET: test-telegram-client-secret
      TELEGRAM_REDIRECT_URI: http://127.0.0.1:4000/auth/telegram/callback
      API_INTERNAL_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm test:build-smoke
