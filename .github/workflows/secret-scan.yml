name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install checksum-verified scanner
        run: bash scripts/install-gitleaks.sh "$RUNNER_TEMP/secret-scanner"
      - name: Verify detection, history coverage and failure behavior
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/secret-scanner/gitleaks
        run: node scripts/smoke-secret-scan.mjs
      - name: Scan full Git history without exposing findings
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/secret-scanner/gitleaks
        run: node scripts/scan-secrets.mjs
